networks:
  db-net:

services:
  app:
    build:
      context: ./src
      dockerfile: ../Dockerfile
    container_name: hasf-io-app-db
    hostname: hasf-io-app-db
    ports:
      - 8080:80
    networks:
      - db-net
    deploy:
      resources:
        limits:
          cpus: '0.34'
          memory: 50M
    depends_on:
      - db

  db:
    image: yobasystems/alpine-mariadb:10.6.12
    container_name: hasf-io-test-db
    hostname: hasf-io-test-db
    networks:
      - db-net
    deploy:
      resources:
        limits:
          cpus: '0.34'
          memory: 50M
    environment:
      MYSQL_DATABASE: hasf-test-db
      MYSQL_USER: hasf-test-user
      MYSQL_PASSWORD: hasf-test-user-password
      MYSQL_ROOT_PASSWORD: hasf-test-root-password

