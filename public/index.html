	<meta property="og:title"       content="HASF.io"/>

<body class="stc-pattern">
	<nav class="stc-head nav">
		<header class="nav-bg header">
			<img class="nearest-rendering tmp-brand" src="./assets/images/pixel-art/hasf-io-full-brand.png" title="v0.0.2" alt="HASF.io full brand" aria-label="HASF.io version 0.0.2"/>
			<div class="header-group">
				<div id="slide-msg-container" class="slide-msg-container"></div>
				<button id="dnt-btn" class="when-focused dnt-btn" aria-label="Open donate Popup" aria-haspopup="true">
					<svg style="--dim:100%;" aria-hidden="true" xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' viewBox='0 0 16 16'>
						<path d='m8 6.236-.894-1.789c-.222-.443-.607-1.08-1.152-1.595C5.418 2.345 4.776 2 4 2 2.324 2 1 3.326 1 4.92c0 1.211.554 2.066 1.868 3.37.337.334.721.695 1.146 1.093C5.122 10.423 6.5 11.717 8 13.447c1.5-1.73 2.878-3.024 3.986-4.064.425-.398.81-.76 1.146-1.093C14.446 6.986 15 6.131 15 4.92 15 3.326 13.676 2 12 2c-.777 0-1.418.345-1.954.852-.545.515-.93 1.152-1.152 1.595zm.392 8.292a.513.513 0 0 1-.784 0c-1.601-1.902-3.05-3.262-4.243-4.381C1.3 8.208 0 6.989 0 4.92 0 2.755 1.79 1 4 1c1.6 0 2.719 1.05 3.404 2.008.26.365.458.716.596.992a7.6 7.6 0 0 1 .596-.992C9.281 2.049 10.4 1 12 1c2.21 0 4 1.755 4 3.92 0 2.069-1.3 3.288-3.365 5.227-1.193 1.12-2.642 2.48-4.243 4.38z'/>
					</svg>
				</button>
			</div>
		</header>
		<div id="dnt-popup" style="display:none" inert="inert">
			<ul class="nav-bg dnt-pu-content">
				<li class="ghost" role=button>
					<a role="button" class="when-focused" href="https://github.com/sponsors/duckafire/" aria-label="Link to GitHub Sponsors">
						<svg class="svg" style="--dim:4rem" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
							<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
						</svg>
						<h1 class="dnt-pu-title" aria-hidden="true">Sponsors</h1>
					</a>
				</li>
			</ul>
		</div>
		<nav id="tboxes-nav" class="nav-bg tboxes-manager" aria-label="Managing options of text boxes">
			<div id="tboxes-man-opt" class="ghost" data-parent="nav">
				<button id="copy-all-content" class="notranslate btn when-focused tboxes-man-btn" style="--fg:#48480c;--bg:#ddb51a" translate="off" aria-label="Copy all content from text boxes, separated by an empty line">Copy!</button>
				<button id="converter-runner" class="notranslate btn when-focused tboxes-man-btn" style="--fg:#030;--bg:#3a3"       translate="off" aria-label="Run converting algorithm from first to last text last">Run!</button>
				<button id="create-input-box" class="notranslate btn when-focused tboxes-man-btn" style="--fg:#01016a;--bg:#0080ff" translate="off" aria-label="Create a new text box with default configuration">New!</button>
				<select id="tboxes-dir-slt"   class="btn when-focused tboxes-man-btn"  style="--fg:var(--BG);--bg:var(--FG)" title="Alignment of text content from text boxes" aria-label="Alignment of text content from text boxes">
					<!-- Using `=` and `-` as temporary solution
					  -- because <option> only supports pure text. -->
					<option value="left"    title="Align to left" aria-label="Align to left">=--</option>
					<option value="center"  title="Align to center" aria-label="Align to center">-=-</option>
					<option value="right"   title="Align to right" aria-label="Align to right">--=</option>
					<option value="justify" title="Align to balanced center (justified lines)" aria-label="Align to balanced center (justified lines)">===</option>
				</select>
			</div>
		</nav>
	</nav>

	<main class="stc-body playground">
		<div id="tboxes-container" class="tboxes-container">
			<template id="tpt-tbox">
				<section class="tbox" data-type="output" data-list-id=" " aria-label="Text box unit">
					<nav class="tbox-nav">
						<select class="btn when-focused tbox-slt tbox-char-format-js" title="Characters format" aria-label="Select characters format">
							<option value="2"  >Binary</option>
							<option value="10" >Decimal</option>
							<option value="16" >Hexadecimal</option>
							<option value="8"  >Octal</option>
							<option value="NaN">Unicode (TEXT)</option>
						</select>
						<button class="btn when-focused tbox-btn-clone  tbox-btn" title="Clone text box"  aria-label="Clone text box">
							<svg aria-hidden="true" xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' viewBox='0 0 16 16'>
								<path fill-rule='evenodd' d='M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2'/>
							</svg>
						</button>
						<button class="btn when-focused tbox-btn-copy   tbox-btn" title="Copy content"    aria-label="Copy content">
							<svg aria-hidden="true" xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' viewBox='0 0 16 16'>
								<path fill-rule='evenodd' d='M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z'/>
							</svg>
						</button>
						<button class="btn when-focused tbox-btn-delete tbox-btn" title="Delete text box" aria-label="Delete text box">
							<svg aria-hidden="true" xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' viewBox='0 0 16 16'>
								<path d='M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5'/>
							</svg>
						</button>
					</nav>
					<textarea class="notranslate tbox-input" translate="off" placeholder="Result from past cell." tabindex="-1" readonly="readonly" aria-live="off"></textarea>
				</section>
			</template>
		</div>

		<script src="./templates/tbox/dom.js"></script>
		<script>newTBox();newTBox();</script>

		<aside class="aside">
			<div id="tboxes-aside" class="aside-tboxes-man">
			</div>
		</aside>
	</main>
