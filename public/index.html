	<title class="notranslate" translate="no">HASF.io</title>

	<meta property="og:title"       content="HASF.io"/>
	<!-- <meta property="og:image"       content=""/> -->
	<meta property="og:description" content="Light, private, fast, and FREE (forever)!"/>

	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>

<body class="stc-pattern">
	<nav class="stc-head nav">
		<header class="nav-bg header">
			<img class="nearest-rendering tmp-brand" src="./assets/images/pixel-art/hasf-io-full-brand.png" title="v0.0.1" alt="HASF.io full brand" aria-label="HASF.io version 0.0.1"/>
			<div class="header-group">
				<span class="slide-msg">Help this project!</span>
				<button id="dnt-btn" class="when-focused i-heart dnt-btn" aria-label="Open donate Popup" aria-haspopup="true"></button>
			</div>
		</header>
		<div id="dnt-popup" style="display:none" inert="inert">
			<ul class="nav-bg dnt-pu-content">
				<li class="ghost" role=button>
					<a role="button" class="when-focused" href="https://github.com/sponsors/duckafire/" aria-label="Link to GitHub Sponsors">
						<svg class="svg" style="--dim:4rem" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
							<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
						</svg>
						<h1 class="dnt-pu-title" aria-hidden="true">Sponsors</h1>
					</a>
				</li>
			</ul>
		</div>
		<nav class="nav-bg tboxes-manager" aria-label="Managing options of text boxes">
			<button id="converter-runner" class="btn when-focused tboxes-man-btn" style="--fg:#030;--bg:#3a3"      aria-label="Run converting algorithm from first to last text last">Run!</button>
			<button id="create-input-box" class="btn when-focused tboxes-man-btn" style="--fg:#00080;--bg:#0080ff" aria-label="Create a new text box with default configuration">New!</button>
		</nav>
	</nav>

	<main id="tboxes-container" class="stc-body playground tboxes-container">
		<template id="tpt-tbox">
			<section class="tbox" data-type="output" data-list-id=" " aria-label="Text box unit">
				<nav class="tbox-nav">
					<select class="btn when-focused tbox-slt tbox-char-format-js" title="Characters format" aria-label="Select characters format">
						<option value="bin">Binary</option>
						<option value="dec">Decimal</option>
						<option value="hex">Hexadecimal</option>
						<option value="oct">Octal</option>
						<option value="uni">Unicode (TEXT)</option>
					</select>
					<button class="btn when-focused tbox-btn-clone  tbox-btn" title="Clone text box"  aria-label="Clone text box" ><span class="i-plus"  aria-hidden="true"></span></button>
					<button class="btn when-focused tbox-btn-copy   tbox-btn" title="Copy content"    aria-label="Copy content"   ><span class="i-copy"  aria-hidden="true"></span></button>
					<button class="btn when-focused tbox-btn-delete tbox-btn" title="Delete text box" aria-label="Delete text box"><span class="i-trash" aria-hidden="true"></span></button>
				</nav>
				<textarea class="tbox-input" placeholder="Result from past cell." readonly="readonly" aria-live="off"></textarea>
			</section>
		</template>

		<script src="./templates/tbox/dom.js"></script>
		<script>newTBox();newTBox();</script>
	</main>

	<footer class="footer-bg stc-tail footer">

			</span>

	</footer>
