	<meta property="og:title"       content="HASF.io"/>

	<link rel="stylesheet" type="text/css" href="./icons.css"/>
	<link rel="stylesheet" type="text/css" href="./style/nav.css"/>
	<link rel="stylesheet" type="text/css" href="./style/converter.css"/>
	<link rel="stylesheet" type="text/css" href="./style/footer.css"/>
</head>
<body>
	<nav class="nav">
		<header class="header">
			<div>
				<div class="tmp-icon"></div>
			</div>
			<div class="dnt-area">
				<span class="dnt-msg">Help this project!</span>
				<button id="dnt-btn" class="i-heart dnt-btn"></button>
			</div>
		</header>
		<div id="dnt-popup" class="popup" style="display:none" inert="inert">
			<ul class="dnt-popup-content">
				<li class="dnt-popup-item" role=button>
					<img  class="dnt-popup-item-img" src="./assets/svg/github.svg"/>
					<h1 class="dnt-popup-item-title" >foo bar</h1>
				</li>
				<li class="dnt-popup-item" role="button">
					<img  class="dnt-popup-item-img" src="./assets/svg/github.svg"/>
					<h1 class="dnt-popup-item-title" >foo bar</h1>
				</li>
			</ul>
		</div>
		<script src="./events/nav-popup.js"></script>
	</nav>

	<main class="converter">
		<nav class="converter-man">
			<button id="converter-runner" class="converter-man-btn">Run!</button>
			<button id="create-input-box" class="converter-man-btn">New!</button>
		</nav>
		<section id="tboxes-container" class="tboxes-container">

			<template id="tpt-tbox">
				<section class="tbox" data-type="output" data-list-id=" ">
					<nav class="tbox-nav">
						<select class="tbox-slt">
							<option value="dig" >Digits</option>
							<option value="asc" >ASCII</option>
							<option value="u8"  >UTF-8</option>
							<option value="u16">UTF-16</option>
							<option value="u32">UTF-32</option>
						</select>
						<select class="tbox-slt">
							<option value="bin">Binary</option>
							<option value="oct">Octal</option>
							<option value="dec">Decimal</option>
							<option value="hex">Hexadecimal</option>
						</select>
						<button class="tbox-btn-clone  tbox-btn" title="Clone text box" ><span class="i-plus" ></span></button>
						<button class="tbox-btn-copy   tbox-btn" title="Copy content"   ><span class="i-copy" ></span></button>
						<button class="tbox-btn-delete tbox-btn" title="Delete text box"><span class="i-trash"></span></button>
					</nav>
					<textarea class="tbox-input" placeholder="Result from past cell." readonly="readonly"></textarea>
				</section>
			</template>

			<script src="./templates/tbox.js"></script>
			<script>newTBox();newTBox();</script>

		</section>
	</main>
	<script src="./events/convert.js"></script>
	<script src="./events/new-input-box.js"></script>

			</li>
			<li>
				License:
				<a href="https://www.gnu.org/licenses/agpl-3.0.en.html">AGPL3</a>.
			</li>
		</ul>
	</footer>
</body>
